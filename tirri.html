<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bhallu Database · Aarish</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1f;
            font-family: 'Segoe UI', 'Fira Code', monospace;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 130px;
        }
        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        .main-content::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #facc15, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 4px;
        }
        .sub {
            color: #94a3b8;
            margin-bottom: 16px;
            font-size: 0.75rem;
        }
        .controls {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 48px;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .url-group {
            flex: 2;
            min-width: 180px;
        }
        .url-group label {
            font-size: 0.65rem;
            color: #94a3b8;
            display: block;
        }
        input {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 40px;
            padding: 6px 12px;
            color: white;
            font-size: 0.75rem;
            width: 100%;
        }
        .search-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .search-group input {
            width: 160px;
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.7rem;
        }
        .show-data-btn { background: #10b981; }
        .data-container {
            background: #0f172a;
            border: 1px solid #2d3a5e;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .data-header {
            background: #1e293b;
            padding: 8px 16px;
            border-bottom: 1px solid #334155;
        }
        .stats {
            font-size: 0.8rem;
            color: #facc15;
        }
        .user-list {
            max-height: none;
            overflow-y: visible;
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #1e2a3e;
            cursor: pointer;
        }
        .user-row:hover {
            background: rgba(250, 204, 21, 0.08);
        }
        .phone-number {
            color: #facc15;
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(250, 204, 21, 0.1);
            padding: 4px 12px;
            border-radius: 40px;
        }
        .password {
            color: #94a3b8;
            font-size: 0.85rem;
            font-family: monospace;
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .user-row.highlight {
            background: #dc2626;
        }
        .user-row.highlight .phone-number,
        .user-row.highlight .password {
            background: #b91c1c;
            color: #ffffff;
        }
        .user-row.copied {
            background: #facc15 !important;
            border-left: 5px solid #ffffff;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
            transition: all 0.2s ease;
            position: relative;
            z-index: 2;
        }
        .user-row.copied .phone-number,
        .user-row.copied .password {
            background: #facc15;
            color: #0f172a;
            font-weight: bold;
        }
        .empty, .loading, .error {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }
        .error { color: #ff8888; }
        .toast {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #facc15;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .web-view {
            display: none;
            height: calc(100vh - 130px);
        }
        .web-view iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            background: #fff;
        }
        .last-copied-panel {
            position: fixed;
            bottom: 70px;
            left: 10px;
            right: 10px;
            background: #0f172a;
            border: 1px solid #facc15;
            border-radius: 40px;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            font-size: 0.7rem;
            backdrop-filter: blur(4px);
        }
        .last-copied-label {
            color: #94a3b8;
            white-space: nowrap;
            margin-right: 6px;
        }
        .last-copied-value {
            color: #facc15;
            font-weight: bold;
            font-family: monospace;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 40px;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .last-copied-btn {
            background: #475569;
            padding: 2px 12px;
            font-size: 0.65rem;
            white-space: nowrap;
            margin-left: 6px;
        }
        .copy-count-badge {
            background: #facc15;
            color: #0f172a;
            font-size: 0.6rem;
            font-weight: bold;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
        }
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 8px 20px;
            z-index: 100;
        }
        .bottom-menu .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #94a3b8;
            font-size: 0.7rem;
            transition: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-menu .menu-item:active {
            transform: scale(0.96);
            background: #1e293b;
        }
        .bottom-menu .menu-item.active {
            background: #facc15;
            color: #0f172a;
        }
        .bottom-menu .menu-item .icon {
            font-size: 1.2rem;
        }
        @media (max-width: 700px) {
            .main-content { padding: 12px; padding-bottom: 140px; }
            .last-copied-panel { bottom: 65px; left: 8px; right: 8px; }
            .last-copied-value { max-width: 120px; }
            .bottom-menu .menu-item { padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div class="main-content" id="mainContent">
        <div id="homeView" class="container">
            <h1>📂 Bhallu Database · User List</h1>
            <div class="sub">Tap phone → copy number | Tap password → copy password</div>

            <div class="controls">
                <div class="url-group">
                    <label>🔥 Firebase URL</label>
                    <input type="text" id="displayUrl" value="https://bhallu-ki-gaad-default-rtdb.asia-southeast1.firebasedatabase.app/.json" readonly>
                </div>
                <div class="search-group">
                    <input type="text" id="searchInput" placeholder="🔍 Find phone/pass">
                    <button id="findBtn">Find</button>
                    <button id="nextBtn">Next</button>
                    <button id="clearBtn">Clear</button>
                    <button id="refreshBtn">Refresh</button>
                    <button id="showDataBtn" class="show-data-btn">📡 Show Data</button>
                </div>
            </div>

            <div class="data-container">
                <div class="data-header">
                    <div class="stats" id="statsInfo">📊 Auto-loading...</div>
                </div>
                <div id="userList" class="user-list">
                    <div class="empty">✨ Loading...</div>
                </div>
            </div>
        </div>

        <div id="webView" class="web-view">
            <iframe id="yaarwinFrame" src="https://yaarwin.xyz/#/login" title="YaarWin Login" allow="clipboard-read; clipboard-write"></iframe>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <div class="last-copied-panel">
        <div style="display:flex;align-items:center;">
            <span class="last-copied-label">📋 Latest:</span>
            <span class="last-copied-value" id="lastCopiedValue">None</span>
            <span id="copyCountBadge" class="copy-count-badge" style="display:none;">1</span>
        </div>
        <button id="showLastBtn" class="last-copied-btn">Show All</button>
    </div>

    <div class="bottom-menu">
        <button id="homeMenuBtn" class="menu-item active">
            <span class="icon">🏠</span>
            <span>Home</span>
        </button>
        <button id="webMenuBtn" class="menu-item">
            <span class="icon">🌐</span>
            <span>Web</span>
        </button>
    </div>

<script>
    const ALPHA_URL = "https://chatting-fb684-default-rtdb.firebaseio.com/.json";

    let allUsers = [];
    let matches = [];
    let matchIndex = -1;
    let currentSearch = '';
    let savedScrollTop = 0;
    let lastCopiedList = [];
    try {
        const stored = localStorage.getItem('lastCopiedListFirebase');
        if (stored) {
            const parsed = JSON.parse(stored);
            lastCopiedList = Array.isArray(parsed) ? parsed : (parsed ? [parsed] : []);
        } else {
            const old = localStorage.getItem('lastCopiedFirebase');
            if (old) lastCopiedList = [old];
        }
    } catch(e){ lastCopiedList = []; }

    const mainContent = document.getElementById('mainContent');
    const userListDiv = document.getElementById('userList');
    const statsSpan = document.getElementById('statsInfo');
    const searchInput = document.getElementById('searchInput');
    const findBtn = document.getElementById('findBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const showDataBtn = document.getElementById('showDataBtn');
    const toast = document.getElementById('toastMsg');
    const homeView = document.getElementById('homeView');
    const webView = document.getElementById('webView');
    const homeMenuBtn = document.getElementById('homeMenuBtn');
    const webMenuBtn = document.getElementById('webMenuBtn');
    const lastCopiedSpan = document.getElementById('lastCopiedValue');
    const copyCountBadge = document.getElementById('copyCountBadge');
    const showLastBtn = document.getElementById('showLastBtn');

    function renderLastCopiedPanel() {
        if (!lastCopiedList.length) {
            lastCopiedSpan.textContent = "None";
            showLastBtn.textContent = "Show All";
            copyCountBadge.style.display = "none";
            return;
        }
        lastCopiedSpan.textContent = lastCopiedList[0];
        const count = lastCopiedList.length;
        if (count > 1) {
            copyCountBadge.textContent = count;
            copyCountBadge.style.display = "inline-flex";
            showLastBtn.textContent = "Show All";
        } else {
            copyCountBadge.style.display = "none";
            showLastBtn.textContent = "Show";
        }
    }

    function updateLastCopiedDisplay(value) {
        lastCopiedList = lastCopiedList.filter(v => v !== value);
        lastCopiedList.unshift(value);
        if (lastCopiedList.length > 3) lastCopiedList = lastCopiedList.slice(0, 3);
        renderLastCopiedPanel();
        try {
            localStorage.setItem('lastCopiedListFirebase', JSON.stringify(lastCopiedList));
        } catch(e){}
    }

    renderLastCopiedPanel();

    // Instant cached data display so users see data immediately on open
    (function loadCache(){
        try {
            const cached = localStorage.getItem('bhalluUsersCache');
            if (cached) {
                allUsers = JSON.parse(cached);
                renderList();
                statsSpan.innerText = `📞 ${allUsers.length} users — refreshing...`;
                restoreCopiedHighlight();
            }
        } catch(e){}
    })();

    function showLastCopied() {
        if (!lastCopiedList.length) {
            alert("Nothing copied yet.");
            return;
        }
        let msg = "📋 Last " + lastCopiedList.length + " Copied:\n\n";
        lastCopiedList.forEach((val, idx) => {
            msg += `${idx + 1}. ${val}\n`;
        });
        alert(msg);
    }
    showLastBtn.addEventListener('click', showLastCopied);

    function switchToHome() {
        if (homeView.style.display === 'none') {
            savedScrollTop = mainContent.scrollTop;
            homeView.style.display = 'block';
            webView.style.display = 'none';
            homeMenuBtn.classList.add('active');
            webMenuBtn.classList.remove('active');
            setTimeout(() => { mainContent.scrollTop = savedScrollTop; }, 30);
        }
    }

    function switchToWeb() {
        if (webView.style.display === 'none') {
            savedScrollTop = mainContent.scrollTop;
            homeView.style.display = 'none';
            webView.style.display = 'block';
            webMenuBtn.classList.add('active');
            homeMenuBtn.classList.remove('active');
        }
    }

    let lastHomeTap = 0;
    function handleHomeTap() {
        const now = Date.now();
        if (now - lastHomeTap < 350) mainContent.scrollTo({ top: 0, behavior: 'smooth' });
        lastHomeTap = now;
        switchToHome();
    }
    homeMenuBtn.addEventListener('mousedown', handleHomeTap);
    homeMenuBtn.addEventListener('touchstart', handleHomeTap);
    webMenuBtn.addEventListener('mousedown', switchToWeb);
    webMenuBtn.addEventListener('touchstart', switchToWeb);

    function showToastMsg(msg, isError = false) {
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#b91c1c' : '#1e293b';
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    }

    function highlightCopiedRow(rowEl) {
        document.querySelectorAll('.user-row').forEach(r => {
            r.classList.remove('copied');
        });
        rowEl.classList.add('copied');
        if (rowEl._copyTimer) clearTimeout(rowEl._copyTimer);
        rowEl._copyTimer = setTimeout(() => {
            rowEl.classList.remove('copied');
        }, 3000);
    }

    function restoreCopiedHighlight() {
        if (!lastCopiedList.length || !allUsers.length) return;
        const copiedVal = lastCopiedList[0];
        let foundIdx = -1;
        for (let i = 0; i < allUsers.length; i++) {
            if (allUsers[i].phone === copiedVal || allUsers[i].password === copiedVal) {
                foundIdx = i;
                break;
            }
        }
        if (foundIdx !== -1) {
            const row = userListDiv.querySelector(`[data-idx="${foundIdx}"]`);
            if (row) {
                document.querySelectorAll('.user-row.copied').forEach(r => r.classList.remove('copied'));
                row.classList.add('copied');
            }
        }
    }

    async function copyText(text, label, rowEl) {
        try {
            await navigator.clipboard.writeText(text);
            updateLastCopiedDisplay(text);
            if (rowEl) highlightCopiedRow(rowEl);
            showToastMsg(`✅ ${label} copied: ${text.substring(0, 20)}${text.length > 20 ? '…' : ''}`);
        } catch {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            updateLastCopiedDisplay(text);
            if (rowEl) highlightCopiedRow(rowEl);
            showToastMsg(`📋 ${label} copied`);
        }
    }

    function extractUsers(obj, arr) {
        if (!obj || typeof obj !== 'object') return;
        if (obj.phone) {
            arr.push({ phone: String(obj.phone), password: obj.password !== undefined ? String(obj.password) : '(no password)' });
        }
        for (let val of Object.values(obj)) extractUsers(val, arr);
    }

    async function fetchData() {
        userListDiv.innerHTML = '<div class="loading">⏳ Fetching...</div>';
        statsSpan.innerText = '⏳ Loading...';
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            const res = await fetch(ALPHA_URL, { signal: controller.signal });
            clearTimeout(timeout);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const users = [];
            extractUsers(data, users);
            const map = new Map();
            for (let u of users) map.set(u.phone, u);
            allUsers = Array.from(map.values()).sort((a,b) => a.phone.localeCompare(b.phone));
            renderList();
            statsSpan.innerText = `📞 ${allUsers.length} users — tap to copy`;
            clearHighlight();
            restoreCopiedHighlight();
            setTimeout(() => { mainContent.scrollTop = savedScrollTop; }, 50);
            try { localStorage.setItem('bhalluUsersCache', JSON.stringify(allUsers)); } catch(e){}
        } catch (err) {
            userListDiv.innerHTML = `<div class="error">❌ Error: ${err.name === 'AbortError' ? 'Request timeout (20s)' : err.message}</div>`;
            statsSpan.innerText = '❌ Failed';
            allUsers = [];
        }
    }

    function renderList() {
        if (!allUsers.length) {
            userListDiv.innerHTML = '<div class="empty">No users found. Try "Show Data".</div>';
            return;
        }
        const frag = document.createDocumentFragment();
        for (let i = 0; i < allUsers.length; i++) {
            const u = allUsers[i];
            const row = document.createElement('div');
            row.className = 'user-row';
            row.setAttribute('data-idx', i);
            row.innerHTML = `
                <span class="phone-number">📞 ${escapeHtml(u.phone)}</span>
                <span class="password">🔑 ${escapeHtml(u.password)}</span>
            `;
            row.querySelector('.phone-number').onclick = (e) => {
                e.stopPropagation();
                copyText(u.phone, 'Phone', row);
            };
            row.querySelector('.password').onclick = (e) => {
                e.stopPropagation();
                copyText(u.password, 'Password', row);
            };
            frag.appendChild(row);
        }
        userListDiv.innerHTML = '';
        userListDiv.appendChild(frag);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function clearHighlight() {
        document.querySelectorAll('.user-row.highlight').forEach(r => r.classList.remove('highlight'));
        matches = [];
        matchIndex = -1;
    }

    function focusMatch() {
        if (matchIndex < 0 || matchIndex >= matches.length) return;
        const idx = matches[matchIndex];
        const row = userListDiv.querySelector(`[data-idx="${idx}"]`);
        if (row) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        statsSpan.innerText = `📞 ${allUsers.length} users — match ${matchIndex + 1}/${matches.length}`;
    }

    findBtn.addEventListener('click', () => {
        const term = searchInput.value.trim();
        if (!term) return;
        currentSearch = term;
        clearHighlight();
        matches = [];
        const lower = term.toLowerCase();
        allUsers.forEach((u, i) => {
            if (u.phone.includes(term) || u.password.toLowerCase().includes(lower)) matches.push(i);
        });
        if (!matches.length) { showToastMsg('No matches found', true); return; }

        // Sab search results ko permanently red highlight karo
        matches.forEach(idx => {
            const row = userListDiv.querySelector(`[data-idx="${idx}"]`);
            if (row) row.classList.add('highlight');
        });

        matchIndex = 0;
        focusMatch();
    });

    nextBtn.addEventListener('click', () => {
        if (!matches.length) return;
        matchIndex = (matchIndex + 1) % matches.length;
        focusMatch();
    });

    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearHighlight();
        statsSpan.innerText = allUsers.length ? `📞 ${allUsers.length} users — tap to copy` : `📊 Auto-loading...`;
    });

    showDataBtn.addEventListener('click', fetchData);
    refreshBtn.addEventListener('click', fetchData);

    fetchData();
</script>
</body>
</html>
